<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#dcd0f1"><title>Para Astrid 💜</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:#55416c;background:radial-gradient(ellipse at 18% 12%,#fff9ff 0%,transparent 43%),radial-gradient(ellipse at 85% 85%,#d2b9ee 0%,transparent 52%),linear-gradient(145deg,#f4ecfb,#e7d8f5 50%,#cdb8e8)}.glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 48%,#fff9ff99,transparent 58%)}.stars,.hearts{position:fixed;inset:0;overflow:hidden;pointer-events:none}.star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;box-shadow:0 0 9px 2px #fff9;animation:twinkle var(--d) ease-in-out infinite alternate}.heart{position:absolute;bottom:-14vh;left:var(--x);font-family:Arial,sans-serif;font-size:var(--s);color:var(--c);opacity:0;filter:drop-shadow(0 2px 5px #8f64b13a);animation:rise var(--t) linear infinite;animation-delay:var(--delay)}@keyframes rise{0%{transform:translate3d(0,0,0) rotate(-12deg) scale(.7);opacity:0}12%{opacity:.68}85%{opacity:.55}100%{transform:translate3d(var(--drift),-125vh,0) rotate(20deg) scale(1.15);opacity:0}}@keyframes twinkle{from{opacity:.12;transform:scale(.7)}to{opacity:1;transform:scale(1.8)}}main{position:relative;z-index:2;width:min(89vw,460px);padding:45px 31px 43px;text-align:center;border:1px solid #ffffffcc;border-radius:30px;background:linear-gradient(155deg,#ffffffc9,#f9f3ffad);box-shadow:0 25px 65px #77518d35,inset 0 1px #fff;backdrop-filter:blur(12px)}main:before{content:"";position:absolute;inset:9px;border:1px solid #b99bce55;border-radius:23px;pointer-events:none}.eyebrow{font:11px Arial,sans-serif;letter-spacing:4px;text-transform:uppercase;color:#9a7aaf;margin:0 0 20px}.emblem{position:relative;width:115px;height:105px;margin:0 auto 17px;display:grid;place-items:center}.halo{position:absolute;width:98px;height:98px;border-radius:50%;background:#d9b9f055;box-shadow:0 0 0 10px #e9d9f055,0 0 36px #b68cdd99;animation:breathe 3.4s ease-in-out infinite}.big-heart{position:relative;font:75px Arial,sans-serif;line-height:1;color:#a66cc7;text-shadow:0 7px 13px #8e5aa44d;animation:beat 2.3s ease-in-out infinite}.orbit{position:absolute;color:#bd8dd9;font:18px Arial,sans-serif;animation:float 4s ease-in-out infinite}.orbit.one{top:3px;right:5px}.orbit.two{bottom:7px;left:0;font-size:13px;animation-delay:-2s}.orbit.three{top:18px;left:7px;font-size:10px;animation-delay:-1s}@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.09)}29%{transform:scale(1)}42%{transform:scale(1.07)}60%{transform:scale(1)}}@keyframes breathe{50%{transform:scale(1.12);opacity:.6}}@keyframes float{50%{transform:translateY(-10px)}}h1{font-size:clamp(30px,8vw,41px);font-weight:normal;letter-spacing:.2px;color:#714d91;margin:0 0 12px}.line{width:72px;height:1px;margin:0 auto 23px;background:linear-gradient(90deg,transparent,#ad80c9,transparent)}.message{font-size:clamp(17px,4.6vw,20px);line-height:1.85;margin:0;color:#604b72}.signature{margin:25px 0 0;font-size:24px;font-style:italic;color:#9062b2}.footer{margin:15px 0 0;font:11px Arial,sans-serif;letter-spacing:2px;color:#a68cb8}@media(prefers-reduced-motion:reduce){.heart,.star,.halo,.big-heart,.orbit{animation:none}.heart{display:none}}</style></head><body><div class="glow"></div><div class="stars" id="stars"></div><div class="hearts" id="hearts"></div><main><p class="eyebrow">Un pedacito de mi corazón</p><div class="emblem"><div class="halo"></div><span class="orbit one">✦</span><span class="orbit two">♥</span><span class="orbit three">✧</span><span class="big-heart">♥</span></div><h1>Para ti, Astrid</h1><div class="line"></div><p class="message">Astrid, los días contigo se vuelven únicos, incluso en los momentos más sencillos. Porque no importa dónde estemos ni qué hagamos, lo más bonito de cada día es compartirlo contigo.</p><p class="signature">Te amo mucho. 💜</p><p class="footer">HOY Y TODOS LOS DÍAS</p></main><script>const hearts=document.getElementById('hearts');const colors=['#a675c8','#c49add','#e1b9e8','#9c77bc','#d5a4d5'];for(let i=0;i<35;i++){const h=document.createElement('span');h.className='heart';h.textContent=i%5===0?'♡':'♥';h.style.setProperty('--x',Math.random()*100+'%');h.style.setProperty('--s',12+Math.random()*21+'px');h.style.setProperty('--c',colors[i%colors.length]);h.style.setProperty('--t',12+Math.random()*15+'s');h.style.setProperty('--delay',-Math.random()*28+'s');h.style.setProperty('--drift',(Math.random()*130-65)+'px');hearts.appendChild(h)}const stars=document.getElementById('stars');for(let i=0;i<55;i++){const s=document.createElement('span');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.setProperty('--d',1.5+Math.random()*3+'s');s.style.animationDelay=-Math.random()*5+'s';stars.appendChild(s)}</script></body></html>
